<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی‌های ما | ZYVARO</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030305;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;

    --main-color:#a855f7;
    --dark-color:#7c3aed;
    --light-color:#d8b4fe;
    --soft-color:#c084fc;
}

/* =========================
   پس‌زمینه
========================= */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:var(--dark-color);
    filter:blur(170px);
    opacity:.18;
    top:-220px;
    right:-150px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:var(--main-color);
    filter:blur(160px);
    opacity:.12;
    bottom:-180px;
    left:-120px;
    z-index:-1;
}

/* =========================
   منو
========================= */

nav{
    position:sticky;
    top:0;
    z-index:100;

    min-height:78px;
    padding:12px 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    background:rgba(3,3,5,.82);
    backdrop-filter:blur(16px);

    border-bottom:
        1px solid
        rgba(168,85,247,.15);
}

.logo{
    color:var(--soft-color);
    font-size:25px;
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        0 0 10px var(--main-color),
        0 0 30px var(--main-color);
}

.menu{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:16px;
    flex-wrap:wrap;
}

.menu a{
    color:#aaa;
    text-decoration:none;
    transition:.3s;
}

.menu a:hover{
    color:var(--light-color);

    text-shadow:
        0 0 15px var(--main-color);
}

/* =========================
   جستجو
========================= */

.search-box{
    position:relative;
}

.search-input{
    width:145px;
    height:34px;

    padding:0 34px 0 12px;

    border-radius:20px;

    border:
        1px solid
        rgba(168,85,247,.35);

    outline:none;

    background:rgba(20,10,30,.75);

    color:white;

    font-family:Tahoma,Arial,sans-serif;

    transition:.3s;
}

.search-input::placeholder{
    color:#777;
}

.search-input:focus{
    width:190px;

    border-color:var(--main-color);

    box-shadow:
        0 0 15px
        rgba(168,85,247,.25);
}

.search-icon{
    position:absolute;

    right:11px;
    top:7px;

    color:var(--soft-color);

    pointer-events:none;
}

/* =========================
   دکمه رنگ
========================= */

.color-box{
    position:relative;
}

.color-button{
    width:38px;
    height:34px;

    border-radius:10px;

    border:
        1px solid
        rgba(168,85,247,.4);

    background:rgba(20,10,30,.8);

    color:white;

    cursor:pointer;

    font-size:18px;

    transition:.3s;
}

.color-button:hover{
    border-color:var(--main-color);

    box-shadow:
        0 0 18px
        rgba(168,85,247,.3);
}

/* =========================
   پنل رنگ
========================= */

.color-panel{
    position:absolute;

    top:45px;
    right:0;

    width:245px;

    padding:16px;

    border-radius:15px;

    background:rgba(8,6,15,.98);

    border:
        1px solid
        var(--main-color);

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        0 0 25px
        rgba(168,85,247,.15);

    display:none;
}

.color-panel.show{
    display:block;
}

.color-panel-title{
    color:#ddd;
    font-size:13px;
    margin-bottom:12px;
}

/* =========================
   رنگ‌های نئونی آماده
========================= */

.neon-title{
    color:#999;
    font-size:12px;
    margin-bottom:9px;
}

.neon-colors{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.neon-color{
    width:31px;
    height:31px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.4);

    cursor:pointer;

    transition:.25s;
}

.neon-color:hover{
    transform:scale(1.2);
}

.neon-color.green{
    background:#39ff14;
    box-shadow:0 0 14px #39ff14;
}

.neon-color.blue{
    background:#00e5ff;
    box-shadow:0 0 14px #00e5ff;
}

.neon-color.red{
    background:#ff1744;
    box-shadow:0 0 14px #ff1744;
}

.neon-color.pink{
    background:#ff00ff;
    box-shadow:0 0 14px #ff00ff;
}

.neon-color.yellow{
    background:#ffff00;
    box-shadow:0 0 14px #ffff00;
}

/* =========================
   انتخاب رنگ دلخواه
========================= */

.color-picker{
    width:100%;
    height:45px;

    padding:0;

    border:0;

    background:none;

    cursor:pointer;
}

/* =========================
   RGB
========================= */

.rgb-title{
    color:#999;
    font-size:12px;
    margin-top:10px;
    margin-bottom:7px;
}

.rgb-row{
    display:flex;
    gap:6px;
}

.rgb-input{
    width:33%;

    padding:8px 4px;

    border-radius:7px;

    border:1px solid #333;

    background:#111;

    color:white;

    text-align:center;

    outline:none;
}

.rgb-input:focus{
    border-color:var(--main-color);
}

/* =========================
   بازگردانی
========================= */

.reset-color{
    width:100%;

    margin-top:10px;

    padding:8px;

    border:
        1px solid
        #444;

    border-radius:8px;

    background:#171717;

    color:#bbb;

    cursor:pointer;

    transition:.25s;
}

.reset-color:hover{
    border-color:var(--main-color);
    color:white;
}

/* =========================
   عنوان صفحه
========================= */

.hero{
    text-align:center;
    padding:100px 20px 60px;
}

.hero h1{
    font-size:
        clamp(
            55px,
            9vw,
            100px
        );

    font-weight:900;

    background:linear-gradient(
        90deg,
        #ffffff,
        var(--light-color),
        var(--main-color),
        var(--dark-color)
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(
            0 0 30px
            rgba(168,85,247,.35)
        );
}

.line{
    width:85px;
    height:3px;

    margin:25px auto;

    background:var(--main-color);

    box-shadow:
        0 0 12px var(--main-color),
        0 0 30px var(--dark-color);
}

.hero p{
    color:#888;
    font-size:18px;
}

/* =========================
   بازی‌ها
========================= */

.games{
    max-width:1100px;

    margin:
        20px auto
        100px;

    padding:
        0 25px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:30px;
}

.game-card{
    min-height:390px;

    padding:35px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    position:relative;
    overflow:hidden;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(168,85,247,.12),
            rgba(8,8,12,.95)
        );

    border:
        1px solid
        rgba(168,85,247,.2);

    box-shadow:
        inset 0 0 40px
        rgba(168,85,247,.03);

    transition:.4s;
}

.game-card::before{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    top:-100px;
    left:50%;

    transform:
        translateX(-50%);

    background:var(--main-color);

    filter:blur(110px);

    opacity:.12;
}

.game-card::after{
    content:"∞";

    position:absolute;

    top:35px;
    left:50%;

    transform:
        translateX(-50%);

    font-size:150px;
    font-weight:900;

    color:var(--main-color);

    opacity:.09;

    text-shadow:
        0 0 50px
        var(--main-color);
}

.game-card:hover{
    transform:
        translateY(-12px);

    border-color:
        rgba(168,85,247,.65);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55),

        0 0 35px
        rgba(168,85,247,.16);
}

.status{
    position:relative;
    z-index:2;

    width:fit-content;

    padding:6px 12px;

    margin-bottom:15px;

    border-radius:20px;

    color:var(--light-color);

    background:
        rgba(168,85,247,.1);

    border:
        1px solid
        rgba(168,85,247,.3);

    font-size:13px;
}

.game-card h2{
    position:relative;
    z-index:2;

    font-size:42px;

    letter-spacing:3px;

    color:white;

    text-shadow:
        0 0 15px
        rgba(168,85,247,.35);
}

.game-card p{
    position:relative;
    z-index:2;

    color:#888;

    line-height:2;

    margin:
        12px 0
        25px;
}

.game-button{
    position:relative;
    z-index:2;

    width:fit-content;

    padding:
        12px 25px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            var(--dark-color),
            var(--main-color)
        );

    color:white;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

    box-shadow:
        0 0 20px
        rgba(168,85,247,.2);
}

.game-button:hover{
    transform:
        translateY(-3px);

    box-shadow:
        0 0 35px
        rgba(168,85,247,.5);
}

/* =========================
   فوتر
========================= */

footer{
    text-align:center;

    padding:40px 20px;

    color:#555;

    border-top:
        1px solid
        rgba(168,85,247,.12);
}

footer span{
    color:var(--main-color);
}

/* =========================
   موبایل
========================= */

@media(max-width:700px){

    nav{
        padding:12px 4%;
        align-items:flex-start;
    }

    .menu{
        gap:8px;
    }

    .menu a{
        font-size:12px;
    }

    .search-input{
        width:95px;
    }

    .search-input:focus{
        width:125px;
    }

    .games{
        grid-template-columns:1fr;
    }

    .game-card{
        min-height:360px;
    }

    .game-card h2{
        font-size:34px;
    }

}

</style>
</head>

<body>

<!-- =========================
     منوی سایت
========================= -->

<nav>

    <div class="logo">
        ZYVARO
    </div>

    <div class="menu">

        <a href="index.html">
            خانه
        </a>

        <a href="games.html">
            🎮 بازی‌ها
        </a>

        <a href="index.html#about">
            👤 درباره ما
        </a>

        <a href="index.html#news">
            📰 اخبار
        </a>

        <!-- جستجو -->

        <div class="search-box">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="جستجو..."
            >

        </div>

        <!-- انتخاب رنگ -->

        <div class="color-box">

            <button
                id="colorButton"
                class="color-button"
                type="button"
            >
                🎨
            </button>

            <div
                id="colorPanel"
                class="color-panel"
            >

                <div class="color-panel-title">
                    رنگ سایت
                </div>

                <div class="neon-title">
                    رنگ‌های نئونی آماده
                </div>

                <div class="neon-colors">

                    <button
                        class="neon-color green"
                        data-color="#39ff14"
                        title="سبز نئونی"
                        type="button"
                    ></button>

                    <button
                        class="neon-color blue"
                        data-color="#00e5ff"
                        title="آبی نئونی"
                        type="button"
                    ></button>

                    <button
                        class="neon-color red"
                        data-color="#ff1744"
                        title="قرمز نئونی"
                        type="button"
                    ></button>

                    <button
                        class="neon-color pink"
                        data-color="#ff00ff"
                        title="صورتی نئونی"
                        type="button"
                    ></button>

                    <button
                        class="neon-color yellow"
                        data-color="#ffff00"title="زرد نئونی"
                        type="button"
                    ></button>

                </div>

                <div class="neon-title">
                    رنگ دلخواه
                </div>

                <input
                    id="colorPicker"
                    class="color-picker"
                    type="color"
                    value="#a855f7"
                >

                <div class="rgb-title">
                    RGB
                </div>

                <div class="rgb-row">

                    <input
                        id="redInput"
                        class="rgb-input"
                        type="number"
                        min="0"
                        max="255"
                        value="168"
                        placeholder="R"
                    >

                    <input
                        id="greenInput"
                        class="rgb-input"
                        type="number"
                        min="0"
                        max="255"
                        value="85"
                        placeholder="G"
                    >

                    <input
                        id="blueInput"
                        class="rgb-input"
                        type="number"
                        min="0"
                        max="255"
                        value="247"
                        placeholder="B"
                    >

                </div>

                <button
                    id="resetColor"
                    class="reset-color"
                    type="button"
                >
                    بازگردانی رنگ
                </button>

            </div>

        </div>

    </div>

</nav>


<!-- =========================
     عنوان
========================= -->

<section class="hero">

    <h1>
        بازی‌های ما
    </h1>

    <div class="line"></div>

    <p>
        وارد دنیای بازی‌های ZYVARO شو.
    </p>

</section>


<!-- =========================
     بازی‌ها
========================= -->

<section class="games">

    <div class="game-card">

        <div class="status">
            به‌زودی
        </div>

        <h2>
            INFINITE
        </h2>

        <p>
            اولین بازی ZYVARO در راه است.
            اطلاعات بیشتر به‌زودی منتشر خواهد شد.
        </p>

        <a
            href="#"
            class="game-button"
        >
            به‌زودی 🚀
        </a>

    </div>

</section>


<!-- =========================
     فوتر
========================= -->

<footer>

    © 2026

    <span>
        ZYVARO
    </span>

    — Game Studio

</footer>


<script>

/* =========================
   عناصر
========================= */

const colorButton =
    document.getElementById(
        "colorButton"
    );

const colorPanel =
    document.getElementById(
        "colorPanel"
    );

const colorPicker =
    document.getElementById(
        "colorPicker"
    );

const redInput =
    document.getElementById(
        "redInput"
    );

const greenInput =
    document.getElementById(
        "greenInput"
    );

const blueInput =
    document.getElementById(
        "blueInput"
    );


/* =========================
   باز و بسته شدن پنل
========================= */

colorButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        colorPanel.classList.toggle(
            "show"
        );

    }
);


colorPanel.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    function(){

        colorPanel.classList.remove(
            "show"
        );

    }
);


/* =========================
   HEX به RGB
========================= */

function hexToRgb(hex){

    hex =
        hex.replace("#","");

    return {

        r:parseInt(
            hex.substring(0,2),
            16
        ),

        g:parseInt(
            hex.substring(2,4),
            16
        ),

        b:parseInt(
            hex.substring(4,6),
            16
        )

    };

}/* =========================
   تغییر رنگ سایت
========================= */

function applyColor(hex){

    const rgb =
        hexToRgb(hex);

    const darkR =
        Math.max(
            0,
            rgb.r - 45
        );

    const darkG =
        Math.max(
            0,
            rgb.g - 45
        );

    const darkB =
        Math.max(
            0,
            rgb.b - 45
        );

    const lightR =
        Math.min(
            255,
            rgb.r + 40
        );

    const lightG =
        Math.min(
            255,
            rgb.g + 40
        );

    const lightB =
        Math.min(
            255,
            rgb.b + 40
        );

    const softR =
        Math.min(
            255,
            rgb.r + 20
        );

    const softG =
        Math.min(
            255,
            rgb.g + 20
        );

    const softB =
        Math.min(
            255,
            rgb.b + 20
        );


    document.body.style.setProperty(
        "--main-color",
        hex
    );

    document.body.style.setProperty(
        "--dark-color",
        `rgb(${darkR},${darkG},${darkB})`
    );

    document.body.style.setProperty(
        "--light-color",
        `rgb(${lightR},${lightG},${lightB})`
    );

    document.body.style.setProperty(
        "--soft-color",
        `rgb(${softR},${softG},${softB})`
    );


    redInput.value =
        rgb.r;

    greenInput.value =
        rgb.g;

    blueInput.value =
        rgb.b;

    colorPicker.value =
        hex;


    localStorage.setItem(
        "zyvaroColor",
        hex
    );

}


/* =========================
   رنگ‌های نئونی آماده
========================= */

document
.querySelectorAll(
    ".neon-color"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                applyColor(
                    this.dataset.color
                );

            }
        );

    }
);


/* =========================
   انتخاب رنگ دلخواه
========================= */

colorPicker.addEventListener(
    "input",
    function(){

        applyColor(
            this.value
        );

    }
);


/* =========================
   RGB
========================= */

function applyRGB(){

    let r =
        Number(
            redInput.value
        );

    let g =
        Number(
            greenInput.value
        );

    let b =
        Number(
            blueInput.value
        );


    if(Number.isNaN(r)){
        r = 0;
    }

    if(Number.isNaN(g)){
        g = 0;
    }

    if(Number.isNaN(b)){
        b = 0;
    }


    r =
        Math.max(
            0,
            Math.min(
                255,
                r
            )
        );

    g =
        Math.max(
            0,
            Math.min(
                255,
                g
            )
        );

    b =
        Math.max(
            0,
            Math.min(
                255,
                b
            )
        );


    const hex =
        "#" +
        [r,g,b]
        .map(
            function(value){

                return value
                .toString(16)
                .padStart(
                    2,
                    "0"
                );

            }
        )
        .join("");


    applyColor(hex);

}


redInput.addEventListener(
    "input",
    applyRGB
);

greenInput.addEventListener(
    "input",
    applyRGB
);

blueInput.addEventListener(
    "input",
    applyRGB
);


/* =========================
   بازگردانی رنگ
========================= */

document
.getElementById(
    "resetColor"
)
.addEventListener(
    "click",
    function(){

        applyColor(
            "#a855f7"
        );

    }
);


/* =========================
   رنگ ذخیره شده
========================= */

const savedColor =
    localStorage.getItem(
        "zyvaroColor"
    );

if(savedColor){

    applyColor(
        savedColor
    );

}


/* =========================
   جستجو
========================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );


searchInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key !== "Enter"
        ){
            return;
        }


        const query =
            this.value
            .trim()
            .toLowerCase();


        if(!query){
            return;
        }


        if(
            query === "خانه" ||
            query === "home"
        ){

            window.location.href =
                "index.html";

            return;

        }


        if(
            query === "بازی" ||
            query === "بازی ها" ||
            query === "بازی‌ها" ||
            query === "games"
        ){

            window.location.href =
                "games.html";

            return;

        }


        if(
            query === "درباره" ||
            query === "درباره ما" ||
            query === "about"
        ){

            window.location.href =
                "index.html#about";

            return;

        }


        if(
            query === "اخبار" ||
            query === "خبر" ||
            query === "news"
        ){

            window.location.href =
                "index.html#news";

            return;

        }


        if(
            query === "infinite"
        ){

            document
            .querySelector(
                ".game-card"
            )
            .scrollIntoView({
                behavior:"smooth"
            });

            return;

        }


        alert(
            "موردی پیدا نشد 😅"
        );

    }
);

</script>

</body>
</html>
