<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بازی‌های ما | ZYVARO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #030305;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* نورهای پس‌زمینه */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #7c3aed;
            filter: blur(170px);
            opacity: .18;
            top: -220px;
            right: -150px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: #a855f7;
            filter: blur(160px);
            opacity: .12;
            bottom: -180px;
            left: -120px;
            z-index: -1;
        }

        /* منو */

        nav {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 78px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(3, 3, 5, .82);
            backdrop-filter: blur(16px);

            border-bottom: 1px solid rgba(168, 85, 247, .15);
        }

        .logo {
            color: #c084fc;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 5px;

            text-shadow:
                0 0 10px #a855f7,
                0 0 30px rgba(168, 85, 247, .45);
        }

        .menu {
            display: flex;
            gap: 28px;
        }

        .menu a {
            color: #aaa;
            text-decoration: none;
            transition: .3s;
        }

        .menu a:hover {
            color: #d8b4fe;
            text-shadow: 0 0 15px #a855f7;
        }

        /* عنوان */

        .hero {
            text-align: center;
            padding: 100px 20px 60px;
        }

        .hero h1 {
            font-size: clamp(55px, 9vw, 100px);
            font-weight: 900;

            background: linear-gradient(
                90deg,
                #ffffff,
                #d8b4fe,
                #a855f7,
                #7c3aed
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(
                0 0 30px rgba(168, 85, 247, .35)
            );
        }

        .line {
            width: 85px;
            height: 3px;

            margin: 25px auto;

            background: #a855f7;

            box-shadow:
                0 0 12px #a855f7,
                0 0 30px #7c3aed;
        }

        .hero p {
            color: #888;
            font-size: 18px;
        }

        /* بازی‌ها */

        .games {
            max-width: 1100px;
            margin: 20px auto 100px;
            padding: 0 25px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .game-card {
            min-height: 390px;

            padding: 35px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            position: relative;
            overflow: hidden;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(168, 85, 247, .12),
                    rgba(8, 8, 12, .95)
                );

            border: 1px solid rgba(168, 85, 247, .2);

            box-shadow:
                inset 0 0 40px rgba(168, 85, 247, .03);

            transition: .4s;
        }

        .game-card::before {
            content: "";

            pos
            ition: absolute;

            width: 260px;
            height: 260px;

            top: -100px;
            left: 50%;

            transform: translateX(-50%);

            background: #a855f7;

            filter: blur(110px);

            opacity: .12;
        }

        .game-card::after {
            content: "∞";

            position: absolute;

            top: 35px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 150px;
            font-weight: 900;

            color: #a855f7;
            opacity: .09;

            text-shadow: 0 0 50px #a855f7;
        }

        .game-card:hover {
            transform: translateY(-12px);

            border-color: rgba(168, 85, 247, .65);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .55),
                0 0 35px rgba(168, 85, 247, .16);
        }

        .status {
            position: relative;
            z-index: 2;

            width: fit-content;

            padding: 6px 12px;
            margin-bottom: 15px;

            border-radius: 20px;

            color: #d8b4fe;
            background: rgba(168, 85, 247, .1);

            border: 1px solid rgba(168, 85, 247, .3);

            font-size: 13px;
        }

        .game-card h2 {
            position: relative;
            z-index: 2;

            font-size: 42px;
            letter-spacing: 3px;

            color: white;

            text-shadow:
                0 0 15px rgba(168, 85, 247, .35);
        }

        .game-card p {
            position: relative;
            z-index: 2;

            color: #888;
            line-height: 2;

            margin: 12px 0 25px;
        }

        .game-button {
            position: relative;
            z-index: 2;

            width: fit-content;

            padding: 12px 25px;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #a855f7
            );

            color: white;
            text-decoration: none;
            font-weight: bold;

            transition: .3s;

            box-shadow:
                0 0 20px rgba(168, 85, 247, .2);
        }

        .game-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 35px rgba(168, 85, 247, .5);
        }

        /* فوتر */

        footer {
            text-align: center;
            padding: 40px 20px;

            color: #555;

            border-top: 1px solid rgba(168, 85, 247, .12);
        }

        footer span {
            color: #a855f7;
        }

        /* موبایل */

        @media (max-width: 700px) {

            nav {
                padding: 0 5%;
            }

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 13px;
            }

            .games {
                grid-template-columns: 1fr;
            }

            .game-card {
                min-height: 360px;
            }

            .game-card h2 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <!-- منوی سایت -->

    <nav>

        <div class="logo">
            ZYVARO
        </div>

        <div class="menu">

            <a href="index.html">
                خانه
            </a>

            <a href="games.html">
                🎮 بازی‌ها
            </a>

            <a href="index.html#about">
                👤 درباره ما
            </a>

            <a href="index.html#news">
                📰 اخبار
            </a>

        </div>

    </nav>


    <!-- عنوان صفحه -->

    <section class="hero">

        <h1>
            بازی‌های ما
        </h1>

        <div class="line"></div>

        <p>
            وارد دنیای بازی‌های ZYVARO شو.
        </p>

    </section>


    <!-- کارت بازی‌ها -->

    <section class="games">

        <div class="game-card">

            <div class="status">
                به‌زودی
            </div>

            <h2>
                INFINITE
            </h2>

            <p>اولین بازی ZYVARO در راه است.
                اطلاعات بیشتر به‌زودی منتشر خواهد شد.
            </p>

            <a
                href="#"
                class="game-button"
            >
                به‌زودی 🚀
            </a>

        </div>

    </section>


    <!-- فوتر -->

    <footer>

        © 2026
        <span>ZYVARO</span>
        — Game Studio

    </footer>

</body>
</html>
